<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city name" spellcheck="false">
            <button id="icon"><img src="https://static-00.iconduck.com/assets.00/search-icon-2048x2048-4r9dtbbw.png" alt=""></button>
        </div>
        <div class="weather">
           <img class="weather-icon" src="images/rain.png" alt="">
           <h2 class="temp">22°c</h2>
           <h2 class="city"> New York</h2>
           <div class="details">
            <div class="col">
                <img src="images/humidity.png" alt="">
            
            <div >
                <p class="humidity">50%</p>
                <p>Humidity</p>
            </div>
        </div>
           
           <div class="col2">
            <img src="images/wind.png" alt="">
      
        <div>
            <p  class="wind">20KM/h</p>
            <p>Wind speed</p>
        </div>
    </div>
       </div>
        </div>
        
    </div>
    <p id="text">hello</p>
     <button id="btn">press</button>
    <script src="action.js"></script>
</body>
</html>
